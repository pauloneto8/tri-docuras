{% if role == 'assistant' %}
<div class="w-8 h-8 shrink-0 rounded-full bg-emerald-600 text-white flex items-center justify-center" aria-hidden="true">
  <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"/>
  </svg>
</div>
{% else %}
<div class="w-8 h-8 shrink-0 rounded-full bg-emerald-600/30 border border-emerald-700 text-emerald-300 flex items-center justify-center text-xs font-semibold" aria-hidden="true">
  {{ user.name[0]|upper }}
</div>
{% endif %}
