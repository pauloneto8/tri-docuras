<div class="flex items-end gap-2 justify-start agent-assistant-bubble">
  {% with role='assistant' %}
  {% include "partials/agent_avatar.html" %}
  {% endwith %}
  <div class="flex flex-col items-start gap-2 min-w-0 max-w-[85%]">
    <div class="px-3.5 py-2.5 text-sm leading-relaxed break-words rounded-2xl rounded-bl-md bg-slate-800 border border-slate-700 text-slate-100">
      <div class="chat-bubble-content">{{ agent_message | chat_md }}</div>
    </div>
    {% if suggestions %}
    {% set chip_target = "#agent-chat-log" %}
    {% set chip_swap = "beforeend" %}
    {% include "partials/agent_suggestions.html" %}
    {% endif %}
  </div>
</div>
