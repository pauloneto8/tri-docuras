{% extends "base.html" %}
{% block title %}Nova conta — AssistFin{% endblock %}
{% block content %}
<div class="mb-6 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
  <div>
    <h1 class="text-lg font-semibold text-slate-100">Nova conta</h1>
    <p class="text-sm text-slate-400">Cadastre uma conta bancária ou carteira.</p>
  </div>
  <a href="/accounts" class="text-sm text-emerald-400 hover:text-emerald-300">← Voltar às contas</a>
</div>

{% if error %}
<p class="mb-4 rounded-lg border border-rose-800 bg-rose-950/40 px-4 py-2 text-rose-300 text-sm">{{ error }}</p>
{% endif %}

<section class="max-w-xl rounded-xl bg-slate-900 border border-slate-800 p-5">
  <form method="post" action="/accounts" class="space-y-3">
    <div>
      <label class="block text-sm text-slate-400 mb-1">Apelido</label>
      <input name="name" type="text" placeholder="Nubank, Itaú Corrente..." class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2" required>
    </div>
    <div>
      <label class="block text-sm text-slate-400 mb-1">Tipo</label>
      <select name="account_type" class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2" required>
        <option value="corrente" selected>Corrente</option>
        <option value="poupanca">Poupança</option>
        <option value="carteira">Carteira</option>
      </select>
    </div>
    <div>
      <label class="block text-sm text-slate-400 mb-1">Instituição <span class="text-slate-500">(opcional)</span></label>
      <input name="institution" type="text" placeholder="Nubank, Itaú..." class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2">
    </div>
    <div>
      <label class="block text-sm text-slate-400 mb-1">Saldo inicial <span class="text-slate-500">(opcional)</span></label>
      <input name="opening_balance" type="text" placeholder="0,00" class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2">
    </div>
    <div>
      <label class="block text-sm text-slate-400 mb-1">Data do saldo inicial</label>
      <input name="opening_balance_date" type="date" value="{{ today }}" class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2">
    </div>
    <button class="w-full rounded-lg bg-emerald-600 hover:bg-emerald-500 px-4 py-2 font-medium">Cadastrar conta</button>
  </form>
</section>
{% endblock %}
