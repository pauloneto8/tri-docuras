{% extends "base.html" %}
{% block title %}Novo orçamento — AssistFin{% endblock %}
{% block content %}
<div class="mb-6 flex flex-col gap-2 sm:flex-row sm:items-center sm:justify-between">
  <div>
    <h1 class="text-lg font-semibold text-slate-100">Novo orçamento</h1>
    <p class="text-sm text-slate-400">Defina um limite por categoria no mês.</p>
  </div>
  <a href="/budgets" class="text-sm text-emerald-400 hover:text-emerald-300">← Voltar aos orçamentos</a>
</div>

{% if error %}
<p class="mb-4 rounded-lg border border-rose-800 bg-rose-950/40 px-4 py-2 text-rose-300 text-sm">{{ error }}</p>
{% endif %}

<section class="max-w-xl rounded-xl bg-slate-900 border border-slate-800 p-5">
  <form method="post" action="/budgets" class="space-y-3">
    <div>
      <label class="block text-sm text-slate-400 mb-1">Categoria</label>
      <select name="category_id" class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2" required>
        {% for cat in categories %}
        <option value="{{ cat.id }}">{{ cat.name }}</option>
        {% endfor %}
      </select>
    </div>
    <div class="grid grid-cols-2 gap-2">
      <div>
        <label class="block text-sm text-slate-400 mb-1">Ano</label>
        <input name="year" type="number" value="{{ today.year }}" class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2" required>
      </div>
      <div>
        <label class="block text-sm text-slate-400 mb-1">Mês</label>
        <input name="month" type="number" min="1" max="12" value="{{ today.month }}" class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2" required>
      </div>
    </div>
    <div>
      <label class="block text-sm text-slate-400 mb-1">Limite (R$)</label>
      <input name="limit" type="text" placeholder="500,00" class="w-full rounded bg-slate-800 border border-slate-700 px-3 py-2" required>
    </div>
    <button class="w-full rounded-lg bg-emerald-600 hover:bg-emerald-500 px-4 py-2 font-medium">Salvar</button>
  </form>
</section>
{% endblock %}
